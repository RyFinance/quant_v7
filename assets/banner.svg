<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="MERIDIAN: post-earnings drift, researched honestly, traded autonomously">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".018"/>
    </pattern>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa733" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffa733" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c97a12"/>
      <stop offset=".55" stop-color="#ffa733"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".06" cy=".2" r=".75">
      <stop offset="0" stop-color="#ffa733" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffa733" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .brand { font-size: 88px; font-weight: 700; letter-spacing: 2px; fill: #ffa733; }
    .kicker { font-size: 10px; letter-spacing: 2.6px; fill: #b57a2a; }
    .sub { font-size: 21px; fill: #c3ccd6; }
    .lbl { font-size: 8.5px; letter-spacing: 2px; fill: #67727e; }
    .val { font-size: 13px; letter-spacing: 1px; fill: #eef2f7; }
    .th { font-size: 8.5px; letter-spacing: 2px; fill: #67727e; }
    .td { font-size: 11.5px; letter-spacing: .8px; fill: #c3ccd6; }
    .key { font-size: 9px; letter-spacing: 1.4px; fill: #9aa5b1; }
    .cursor { animation: blink 1.15s steps(1) infinite; }
    .beat { animation: blink 2.4s steps(1) infinite; }
    .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2s .3s cubic-bezier(.35,0,.2,1) forwards; }
    .fade { animation: fade .8s 1.5s ease forwards; opacity: 0; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  </style>

  <rect width="1280" height="440" fill="#07090b"/>
  <rect width="1280" height="440" fill="url(#glow)"/>
  <rect width="1280" height="440" fill="url(#scan)"/>

  <!-- top status bar -->
  <rect x="0" y="0" width="1280" height="38" fill="#0b0e12"/>
  <line x1="0" y1="38" x2="1280" y2="38" stroke="#1b2229"/>
  <text x="48" y="24" class="mono" font-size="10" letter-spacing="2.8" fill="#ffa733">MERIDIAN</text>
  <text x="140" y="24" class="mono" font-size="10" letter-spacing="2.8" fill="#4a545f">/</text>
  <text x="160" y="24" class="mono" font-size="10" letter-spacing="2.8" fill="#7d8894">PEAD DESK</text>
  <circle class="beat" cx="1044" cy="20" r="3.5" fill="#35d07f"/>
  <text x="1232" y="23" class="mono" font-size="9.5" letter-spacing="2" fill="#7d8894" text-anchor="end">FRI 16:20 NY · CLOSED</text>

  <!-- left: the brand -->
  <text x="48" y="102" class="mono kicker">POST-EARNINGS DRIFT · RESEARCHED HONESTLY</text>
  <text x="48" y="208" class="mono brand">MERIDIAN</text>
  <line x1="48" y1="226" x2="428" y2="226" stroke="#ffa733" stroke-opacity=".35"/>
  <text x="48" y="256" class="sans sub">The desk measures the earnings gap, audits the bias,</text>
  <text x="48" y="286" class="sans sub">then trades the drift the survivors left behind.</text>
  <line x1="48" y1="314" x2="536" y2="314" stroke="#1b2229"/>

  <!-- left: stat blocks -->
  <g class="mono">
    <text x="48" y="340" class="lbl">MODE</text>
    <text x="48" y="362" class="val" fill="#35d07f">SIMULATOR</text>
    <text x="176" y="340" class="lbl">BROKERS</text>
    <text x="176" y="362" class="val">7 LINKED</text>
    <text x="308" y="340" class="lbl">TESTS</text>
    <text x="308" y="362" class="val">5 PRE-REGISTERED</text>
    <text x="482" y="340" class="lbl">HOLD</text>
    <text x="482" y="362" class="val">20 DAYS</text>
  </g>

  <!-- right: the desk panel -->
  <rect x="600" y="70" width="632" height="292" rx="5" fill="#0a0d11" stroke="#232b34"/>
  <rect x="600" y="70" width="632" height="27" rx="5" fill="#11151a"/>
  <line x1="600" y1="97" x2="1232" y2="97" stroke="#232b34"/>
  <text x="618" y="88" class="mono" font-size="9" letter-spacing="2.2" fill="#ffa733">PEAD BOOK · MARKED EQUITY</text>
  <text x="1214" y="88" class="mono" font-size="9" letter-spacing="2" fill="#67727e" text-anchor="end">+12.4% YTD</text>

  <!-- chart grid -->
  <g stroke="#151c23" stroke-width="1">
    <line x1="618" y1="126" x2="1214" y2="126"/>
    <line x1="618" y1="160" x2="1214" y2="160"/>
    <line x1="618" y1="194" x2="1214" y2="194"/>
    <line x1="618" y1="228" x2="1214" y2="228"/>
  </g>
  <g class="mono" font-size="7.5" letter-spacing="1" fill="#3f4954">
    <text x="622" y="122">+12</text>
    <text x="622" y="156">+8</text>
    <text x="622" y="190">+4</text>
    <text x="622" y="224">0</text>
  </g>

  <!-- earnings markers -->
  <g stroke="#ffa733" stroke-opacity=".08" stroke-width="1" stroke-dasharray="2 7">
    <line x1="760" y1="118" x2="760" y2="250"/>
    <line x1="900" y1="118" x2="900" y2="250"/>
    <line x1="1040" y1="118" x2="1040" y2="250"/>
    <line x1="1170" y1="118" x2="1170" y2="250"/>
  </g>

  <!-- equity curve -->
  <path d="M618 240 L638 236 L658 238 L678 227 L698 231 L718 219 L738 223 L758 213 L778 217 L798 205 L818 209 L838 197 L858 201 L878 189 L898 193 L918 181 L938 185 L958 171 L978 175 L998 163 L1018 167 L1038 153 L1058 157 L1078 145 L1098 149 L1118 137 L1138 141 L1158 129 L1178 131 L1198 121 L1214 118 L1214 250 L618 250 Z"
        fill="url(#fill)"/>
  <path class="draw"
        d="M618 240 L638 236 L658 238 L678 227 L698 231 L718 219 L738 223 L758 213 L778 217 L798 205 L818 209 L838 197 L858 201 L878 189 L898 193 L918 181 L938 185 L958 171 L978 175 L998 163 L1018 167 L1038 153 L1058 157 L1078 145 L1098 149 L1118 137 L1138 141 L1158 129 L1178 131 L1198 121 L1214 118"
        fill="none" stroke="url(#line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="fade" cx="1214" cy="118" r="3.4" fill="#ffd08a"/>

  <!-- positions -->
  <line x1="600" y1="258" x2="1232" y2="258" stroke="#1b2229"/>
  <g class="mono">
    <text x="618" y="276" class="th">SYM</text>
    <text x="700" y="276" class="th">SURPRISE</text>
    <text x="840" y="276" class="th">HELD</text>
    <text x="950" y="276" class="th">ENTRY</text>
    <text x="1214" y="276" class="th" text-anchor="end">P&amp;L</text>

    <text x="618" y="299" class="td" fill="#eef2f7">AAPL</text>
    <text x="700" y="299" class="td" fill="#35d07f">+8.4%</text>
    <text x="840" y="299" class="td">14 / 20 d</text>
    <text x="950" y="299" class="td" fill="#7d8894">182.40</text>
    <text x="1214" y="299" class="td" fill="#35d07f" text-anchor="end">+2.14%</text>

    <text x="618" y="321" class="td" fill="#eef2f7">MSFT</text>
    <text x="700" y="321" class="td" fill="#35d07f">+6.1%</text>
    <text x="840" y="321" class="td">6 / 20 d</text>
    <text x="950" y="321" class="td" fill="#7d8894">411.05</text>
    <text x="1214" y="321" class="td" fill="#35d07f" text-anchor="end">+0.92%</text>

    <text x="618" y="343" class="td" fill="#eef2f7">SHOP</text>
    <text x="700" y="343" class="td" fill="#ff6b5e">−4.7%</text>
    <text x="840" y="343" class="td">20 / 20 d</text>
    <text x="950" y="343" class="td" fill="#7d8894">104.22</text>
    <text x="1214" y="343" class="td" fill="#ff6b5e" text-anchor="end">−1.31%</text>
  </g>

  <!-- function keys + command line -->
  <rect x="0" y="392" width="1280" height="48" fill="#0b0e12"/>
  <line x1="0" y1="392" x2="1280" y2="392" stroke="#1b2229"/>
  <g class="mono">
    <g>
      <rect x="48" y="404" width="92" height="24" rx="3" fill="#1a2027"/>
      <text x="58" y="420" class="key" fill="#ffa733">F1</text>
      <text x="80" y="420" class="key" fill="#e6ebf1">DESK</text>
    </g>
    <g>
      <rect x="148" y="404" width="104" height="24" rx="3" fill="#141a20"/>
      <text x="158" y="420" class="key" fill="#8a5c1c">F2</text>
      <text x="180" y="420" class="key">BROKERS</text>
    </g>
    <g>
      <rect x="260" y="404" width="112" height="24" rx="3" fill="#141a20"/>
      <text x="270" y="420" class="key" fill="#8a5c1c">F3</text>
      <text x="292" y="420" class="key">RESEARCH</text>
    </g>
    <g>
      <rect x="380" y="404" width="92" height="24" rx="3" fill="#141a20"/>
      <text x="390" y="420" class="key" fill="#8a5c1c">F4</text>
      <text x="412" y="420" class="key">SETUP</text>
    </g>
    <g>
      <rect x="480" y="404" width="100" height="24" rx="3" fill="#141a20"/>
      <text x="490" y="420" class="key" fill="#8a5c1c">F9</text>
      <text x="512" y="420" class="key">REFRESH</text>
    </g>

    <rect x="640" y="404" width="592" height="24" rx="3" fill="#0e1216" stroke="#232b34"/>
    <text x="654" y="420" class="key" fill="#ffa733">›</text>
    <text x="668" y="420" class="key" fill="#c3ccd6">cycle --now</text>
    <rect class="cursor" x="762" y="409" width="7" height="14" fill="#ffa733"/>
    <text x="1218" y="420" class="key" fill="#4a545f" text-anchor="end">simulator · 127.0.0.1</text>
  </g>
</svg>
